<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소수점 5자리 10초 타이머</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .timer-font {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 flex flex-col items-center justify-center p-4">

    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 shadow-2xl rounded-3xl p-8 sm:p-12 w-full max-w-md text-center relative overflow-hidden">
        
        <!-- Decorative Glow Background -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Title -->
        <h1 class="text-2xl font-bold tracking-tight text-slate-200 mb-2">정밀 10초 타이머</h1>
        <p class="text-xs text-slate-400 mb-8">소수점 5자리(마이크로초 근접)까지 정밀 측정</p>

        <div class="my-6 bg-slate-950/60 border border-slate-800 rounded-2xl p-6 shadow-inner relative">
            <div id="timerDisplay" class="timer-font text-4xl sm:text-5xl font-extrabold tracking-wider text-indigo-400 drop-shadow-[0_0_15px_rgba(99,102,241,0.3)]">
                10.00000
            </div>
            <div class="text-xs text-slate-500 mt-2 uppercase tracking-widest font-semibold">Seconds</div>
        </div>

        <div class="grid grid-cols-3 gap-3 mt-8">
            <button id="startBtn" onclick="startTimer()" class="py-3 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 cursor-pointer">
                <span>시작</span>
            </button>
            <button id="pauseBtn" onclick="pauseTimer()" disabled class="py-3 px-4 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed active:scale-95 transition-all text-slate-200 font-semibold rounded-xl shadow-md flex items-center justify-center gap-2 cursor-pointer">
                <span>일시정지</span>
            </button>
            <button id="resetBtn" onclick="resetTimer()" class="py-3 px-4 bg-rose-600/80 hover:bg-rose-600 active:scale-95 transition-all text-white font-semibold rounded-xl shadow-lg shadow-rose-600/20 flex items-center justify-center gap-2 cursor-pointer">
                <span>리셋</span>
            </button>
        </div>

        <!-- Download HTML File Button -->
        <div class="mt-4">
            <button onclick="downloadHTMLFile()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl text-xs border border-slate-700 transition-all flex items-center justify-center gap-2 cursor-pointer">
                <span>💾 HTML 파일로 다운로드하기</span>
            </button>
        </div>

        <!-- Message Box (Alternative to alert) -->
        <div id="messageBox" class="hidden mt-6 p-4 bg-indigo-950/80 border border-indigo-500/30 text-indigo-200 rounded-xl text-sm animate-pulse">
            시간이 종료되었습니다! 🎉
        </div>
    </div>

    <script>
        // State variables
        let startTime = null;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        const totalDuration = 10000; // 10 seconds in milliseconds

        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const messageBox = document.getElementById('messageBox');

        function updateDisplay(currentTimeLeft) {
            if (currentTimeLeft < 0) currentTimeLeft = 0;
            // Convert milliseconds to seconds with 5 decimal places
            const seconds = (currentTimeLeft / 1000).toFixed(5);
            timerDisplay.textContent = seconds;
        }

        function runTimer() {
            const now = performance.now();
            const elapsedSinceStart = now - startTime;
            let timeLeft = totalDuration - (elapsedTime + elapsedSinceStart);

            if (timeLeft <= 0) {
                timeLeft = 0;
                updateDisplay(timeLeft);
                stopTimer();
                showCompletionMessage();
                return;
            }

            updateDisplay(timeLeft);
            timerInterval = requestAnimationFrame(runTimer);
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            messageBox.classList.add('hidden');
            startTime = performance.now();
            
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            timerInterval = requestAnimationFrame(runTimer);
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            cancelAnimationFrame(timerInterval);
            
            const now = performance.now();
            elapsedTime += (now - startTime);

            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }

        function resetTimer() {
            isRunning = false;
            cancelAnimationFrame(timerInterval);
            startTime = null;
            elapsedTime = 0;
            
            updateDisplay(totalDuration);
            
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            messageBox.classList.add('hidden');
        }

        function stopTimer() {
            isRunning = false;
            cancelAnimationFrame(timerInterval);
        }

        function showCompletionMessage() {
            messageBox.classList.remove('hidden');
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }

        // Function to download the current page as an HTML file
        function downloadHTMLFile() {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'precision_timer.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initialize display on load
        window.onload = function() {
            updateDisplay(totalDuration);
        };
    </script>
</body>
</html>
